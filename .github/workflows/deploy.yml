name: Deploy Canisters

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Install DFINITY SDK (dfx)
      - name: Install DFX
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://internetcomputer.org/install.sh | bash
          echo "$HOME/bin" >> $GITHUB_PATH
          dfx --version

      # Step 3: Authenticate with Identity
      - name: Authenticate with Identity
        run: |
          echo "${{ secrets.DFX_IDENTITY }}" > identity.pem
          dfx identity import --force github_identity < identity.pem
          dfx identity use github_identity
        env:
          DFX_IDENTITY: ${{ secrets.DFX_IDENTITY }}

      # Step 4: Start DFX and Deploy Canisters
      - name: Deploy Canisters
        run: |
          dfx build
          dfx deploy --network ic
