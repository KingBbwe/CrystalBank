name: Deploy MacroManager Canister

on:
  push:
    branches:
      - UI-build

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

- name: Install DFX
  run: |
    mkdir -p "$HOME/bin"
    curl -o "$HOME/bin/dfx" -L https://sdk.dfinity.org/install.sh
    chmod +x "$HOME/bin/dfx"
    echo "$HOME/bin" >> $GITHUB_PATH
    dfx --version


    - name: Start Local Replica
      run: dfx start --background

    - name: Build All Canisters
      run: dfx build

    - name: Deploy MacroManager
      run: dfx deploy MacroManager

    - name: Get Canister ID
      run: dfx canister id MacroManager > canister_id.txt

    - name: Upload Canister ID as Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MacroManager_Canister_ID
        path: canister_id.txt
