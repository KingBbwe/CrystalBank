name: Deploy MacroManager Canister

on:
  push:
    branches:
      - UI-build

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install DFX
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://github.com/dfinity/dfx/releases/download/0.13.1/dfx-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> $GITHUB_PATH
          dfx --version

      - name: Authenticate with Identity
        run: |
          echo "${{ secrets.DFX_IDENTITY }}" > identity.pem
          dfx identity import --force github_identity < identity.pem
          dfx identity use github_identity
        env:
          DFX_IDENTITY: ${{ secrets.DFX_IDENTITY }}

      - name: Set IC Network
        run: echo "network=ic" >> dfx.json
